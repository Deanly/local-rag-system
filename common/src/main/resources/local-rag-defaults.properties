local-rag.ollama.base-url=http://localhost:11434
local-rag.ollama.base-urls=
local-rag.ollama.embedding-model=qwen3-embedding:4b
local-rag.ollama.chat-model=
local-rag.ollama.connect-timeout=PT1.5S
local-rag.ollama.read-timeout=PT2M
local-rag.ollama.health-timeout=PT1.5S
local-rag.ollama.chat-max-tokens=512
local-rag.ollama.chat-temperature=0.1
local-rag.ollama.chat-thinking-enabled=false

local-rag.weaviate.url=http://weaviate:8080

local-rag.registry.path=/config/source-registry.example.yaml
local-rag.registry.require-paths=false

local-rag.services.registry-url=http://source-registry-service:42141
local-rag.services.indexer-url=http://indexer-service:42142
local-rag.services.retrieval-url=http://retrieval-service:42143
local-rag.services.mcp-bridge-url=http://mcp-bridge:42144

local-rag.indexer.embedding-fallback-enabled=false
local-rag.indexer.watch-enabled=true
local-rag.indexer.scan-interval=PT5M
local-rag.indexer.watch-debounce=PT10S

local-rag.retrieval.embedding-fallback-enabled=false
local-rag.retrieval.reranker-enabled=false
local-rag.retrieval.reranker-base-url=
local-rag.retrieval.reranker-connect-timeout=PT0.5S
local-rag.retrieval.reranker-read-timeout=PT5S
local-rag.retrieval.score-gate-enabled=false
local-rag.retrieval.score-gate-similarity-threshold=0.70
local-rag.retrieval.score-gate-reranker-threshold=0.08
local-rag.retrieval.score-gate-similarity-weight=0.30
local-rag.retrieval.score-gate-bucket2-threshold=0.255
local-rag.retrieval.score-gate-bucket3-threshold=0.15
local-rag.retrieval.score-gate-max-k=10
