version: 1
description: "Portable Local RAG retrieval quality fixture. Default cases target only this repository's registered docs so the fixture can run on different local machines without private project ids."
case_groups:
  - id: local-rag-english-identifier
    description: "English and identifier/file-name oriented queries against the Local RAG repository docs."
    cases:
      - id: rq-en-001
        projectId: local-rag-system
        language: english
        intent: codex-utilization-hardening
        query: "codex rag utilization hardening rag_get_document unknown project error"
        expected:
          sourceId: local-rag-system.docs
          relativePath: tasks/T0010-codex-rag-utilization-hardening.md
        modes: [hybrid, keyword, vector]
      - id: rq-en-002
        projectId: local-rag-system
        language: english
        intent: source-registry-design
        query: "source registry project ssot registered source root write policy"
        expected:
          sourceId: local-rag-system.docs
          relativePath: design/source-registry-and-project-ssot.md
        modes: [hybrid, keyword, vector]
      - id: rq-en-003
        projectId: local-rag-system
        language: english
        intent: retrieval-quality-design
        query: "retrieval quality improvement evaluation harness deterministic rerank"
        expected:
          sourceId: local-rag-system.docs
          relativePath: design/retrieval-quality-improvement-design.md
        modes: [hybrid, keyword, vector]
      - id: rq-en-004
        projectId: local-rag-system
        language: english
        intent: chunking-authority-hardening
        query: "T0013 retrieval chunking document authority metadata"
        expected:
          sourceId: local-rag-system.docs
          relativePath: tasks/T0013-retrieval-chunking-and-document-authority-hardening.md
        modes: [hybrid, keyword, vector]
  - id: local-rag-korean-natural-language
    description: "Korean natural-language queries against the Local RAG repository docs."
    cases:
      - id: rq-ko-001
        projectId: local-rag-system
        language: korean
        intent: source-registry-design
        query: "소스 레지스트리 프로젝트 SSOT 등록된 소스 루트 쓰기 정책"
        expected:
          sourceId: local-rag-system.docs
          relativePath: design/source-registry-and-project-ssot.md
        modes: [hybrid, keyword, vector]
      - id: rq-ko-002
        projectId: local-rag-system
        language: korean
        intent: retrieval-quality-design
        query: "검색 품질 평가 하네스와 deterministic rerank 설계"
        expected:
          sourceId: local-rag-system.docs
          relativePath: design/retrieval-quality-improvement-design.md
        modes: [hybrid, keyword, vector]
      - id: rq-ko-003
        projectId: local-rag-system
        language: korean
        intent: chunking-authority-hardening
        query: "문서 권위 메타데이터와 heading aware chunking 작업"
        expected:
          sourceId: local-rag-system.docs
          relativePath: tasks/T0013-retrieval-chunking-and-document-authority-hardening.md
        modes: [hybrid, keyword, vector]
  - id: local-rag-governance
    description: "Local RAG governance cases for metadata filters, stale-source avoidance, and citation usefulness."
    cases:
      - id: rq-gov-001
        projectId: local-rag-system
        language: english
        intent: answer-context-governance
        query: "T0014 search filter answer context governance purpose"
        expected:
          sourceId: local-rag-system.docs
          relativePath: tasks/T0014-search-filter-and-answer-context-governance.md
        modes: [hybrid, keyword]
        mustUseRelativePaths: [tasks/T0014-search-filter-and-answer-context-governance.md]
        mustNotUseRelativePaths: [_templates/task.md]
        mustNotUseStatuses: [draft, deprecated, superseded]
        requireCitation: true
      - id: rq-gov-002
        projectId: local-rag-system
        language: korean
        intent: task-id-korean-suffix
        query: "T0014의 목적은 무엇인가?"
        expected:
          sourceId: local-rag-system.docs
          relativePath: tasks/T0014-search-filter-and-answer-context-governance.md
        modes: [hybrid]
        mustUseRelativePaths: [tasks/T0014-search-filter-and-answer-context-governance.md]
        mustNotUseRelativePaths: [_templates/task.md]
        mustNotUseStatuses: [draft, deprecated, superseded]
        requireCitation: true
