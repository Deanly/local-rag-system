version: 1
device_id: example-device
default_project_id: local-rag-system

projects:
  - project_id: personal-notes
    display_name: Personal Notes
    primary_source_id: personal-notes
    default_context:
      - personal-notes

  - project_id: project-alpha
    display_name: Project Alpha
    primary_source_id: project-alpha.docs
    default_context:
      - project-alpha.docs
      - personal-notes

  - project_id: project-beta
    display_name: Project Beta
    primary_source_id: project-beta.docs
    default_context:
      - project-beta.docs
      - personal-notes

  - project_id: local-rag-system
    display_name: Local RAG System
    primary_source_id: local-rag-system.docs
    default_context:
      - local-rag-system.docs
      - personal-notes

  - project_id: extra-project-06
    display_name: Extra Project 06
    primary_source_id: extra-project-06.docs
    default_context:
      - extra-project-06.docs
      - extra-support-wiki

  - project_id: extra-project-07
    display_name: Extra Project 07
    primary_source_id: extra-project-07.docs
    default_context:
      - extra-project-07.docs
      - extra-support-wiki

  - project_id: extra-support-wiki
    display_name: Extra Support Wiki
    primary_source_id: extra-support-wiki
    default_context:
      - extra-support-wiki

sources:
  - source_id: personal-notes
    project_id: personal-notes
    type: compiled-wiki
    ssot_role: compiled-wiki
    path: ${LOCAL_RAG_SOURCE_PERSONAL_NOTES}
    priority: 80
    active: true
    sensitivity_default: private
    include:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.txt"
    exclude:
      - "**/.git/**"
      - "**/.rag_index/**"
      - "**/node_modules/**"
      - "**/build/**"
      - "**/dist/**"
    read_policy: cross-project-support
    write_policy: source-specific-rule-required

  - source_id: project-alpha.docs
    project_id: project-alpha
    type: project-docs
    ssot_role: project-current-truth
    path: ${LOCAL_RAG_SOURCE_PROJECT_ALPHA_DOCS}
    priority: 100
    active: true
    sensitivity_default: private
    include:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.txt"
    exclude:
      - "**/.git/**"
      - "**/.rag_index/**"
      - "**/node_modules/**"
      - "**/build/**"
      - "**/dist/**"
      - "**/legacy/**"
    read_policy: registered-default
    write_policy: repo-docs

  - source_id: project-beta.docs
    project_id: project-beta
    type: project-docs
    ssot_role: project-current-truth
    path: ${LOCAL_RAG_SOURCE_PROJECT_BETA_DOCS}
    priority: 100
    active: true
    sensitivity_default: work
    include:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.txt"
    exclude:
      - "**/.git/**"
      - "**/.rag_index/**"
      - "**/node_modules/**"
      - "**/build/**"
      - "**/dist/**"
      - "**/legacy/**"
    read_policy: registered-default
    write_policy: repo-docs

  - source_id: local-rag-system.docs
    project_id: local-rag-system
    type: project-docs
    ssot_role: project-current-truth
    path: ${LOCAL_RAG_SOURCE_LOCAL_RAG_SYSTEM_DOCS}
    priority: 100
    active: true
    sensitivity_default: private
    include:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.txt"
    exclude:
      - "**/.git/**"
      - "**/.rag_index/**"
      - "**/_templates/**"
      - "**/node_modules/**"
      - "**/build/**"
      - "**/dist/**"
      - "**/target/**"
    read_policy: registered-default
    write_policy: repo-docs

  - source_id: extra-project-06.docs
    project_id: extra-project-06
    type: project-docs
    ssot_role: project-current-truth
    path: ${LOCAL_RAG_SOURCE_EXTRA_06}
    priority: 100
    active: true
    sensitivity_default: work
    include:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.txt"
    exclude:
      - "**/.git/**"
      - "**/.rag_index/**"
      - "**/.build/**"
      - "**/DerivedData/**"
      - "**/node_modules/**"
      - "**/build/**"
      - "**/dist/**"
      - "**/xcuserdata/**"
    read_policy: registered-default
    write_policy: repo-docs

  - source_id: extra-project-07.docs
    project_id: extra-project-07
    type: project-docs
    ssot_role: project-current-truth
    path: ${LOCAL_RAG_SOURCE_EXTRA_07}
    priority: 100
    active: true
    sensitivity_default: private
    include:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.txt"
    exclude:
      - "**/.git/**"
      - "**/.rag_index/**"
      - "**/node_modules/**"
      - "**/build/**"
      - "**/dist/**"
      - "**/target/**"
    read_policy: registered-default
    write_policy: repo-docs

  - source_id: extra-support-wiki
    project_id: extra-support-wiki
    type: compiled-wiki
    ssot_role: compiled-wiki
    path: ${LOCAL_RAG_SOURCE_EXTRA_08}
    priority: 90
    active: true
    sensitivity_default: private
    include:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.txt"
    exclude:
      - "**/.git/**"
      - "**/.rag_index/**"
      - "**/.obsidian/**"
      - "**/.trash/**"
      - "**/node_modules/**"
      - "**/build/**"
      - "**/dist/**"
    read_policy: cross-project-support
    write_policy: source-specific-rule-required
