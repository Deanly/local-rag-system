name: local-rag-system

services:
  postgres:
    image: postgres:16-alpine
    container_name: local-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: local_rag
      POSTGRES_USER: local_rag
      POSTGRES_PASSWORD: ${LOCAL_RAG_POSTGRES_PASSWORD:-local-rag-dev}
    ports:
      - "127.0.0.1:42130:5432"
    volumes:
      - "${LOCAL_RAG_DATA_DIR:-./.runtime}/postgres:/var/lib/postgresql/data"
      - "./database/postgres/ddl:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_rag -d local_rag"]
      interval: 10s
      timeout: 5s
      retries: 10

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.25.9
    container_name: local-rag-weaviate
    restart: unless-stopped
    ports:
      - "127.0.0.1:42131:8080"
      - "127.0.0.1:42132:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 20
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - "${LOCAL_RAG_DATA_DIR:-./.runtime}/weaviate:/var/lib/weaviate"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  source-registry-service:
    build:
      context: .
      dockerfile: services/source-registry-service/Dockerfile
    container_name: local-rag-source-registry
    restart: unless-stopped
    environment:
      SERVER_PORT: 42141
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/local_rag
      SPRING_DATASOURCE_USERNAME: local_rag
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_RAG_POSTGRES_PASSWORD:-local-rag-dev}
      LOCAL_RAG_SOURCE_REGISTRY: ${LOCAL_RAG_SOURCE_REGISTRY:-/config/source-registry.local.example.yaml}
      LOCAL_RAG_SOURCE_PERSONAL_NOTES: ${LOCAL_RAG_SOURCE_PERSONAL_NOTES:-/source/personal-notes}
      LOCAL_RAG_SOURCE_PROJECT_ALPHA_DOCS: ${LOCAL_RAG_SOURCE_PROJECT_ALPHA_DOCS:-/source/project-alpha-docs}
      LOCAL_RAG_SOURCE_PROJECT_BETA_DOCS: ${LOCAL_RAG_SOURCE_PROJECT_BETA_DOCS:-/source/project-beta-docs}
      LOCAL_RAG_REGISTRY_REQUIRE_PATHS: "true"
    volumes:
      - "${LOCAL_RAG_CONFIG_DIR:-./config}:/config:ro"
      - "${LOCAL_RAG_SOURCE_ROOT:-./data/sample}:/source:ro"
    depends_on:
      postgres:
        condition: service_healthy

  indexer-service:
    build:
      context: .
      dockerfile: services/indexer-service/Dockerfile
    container_name: local-rag-indexer
    restart: unless-stopped
    environment:
      SERVER_PORT: 42142
      RAG_SCAN_INTERVAL_SECONDS: ${LOCAL_RAG_SCAN_INTERVAL_SECONDS:-300}
      RAG_WATCH_ENABLED: ${LOCAL_RAG_WATCH_ENABLED:-true}
      RAG_WATCH_DEBOUNCE_SECONDS: ${LOCAL_RAG_WATCH_DEBOUNCE_SECONDS:-10}
      LOCAL_RAG_INDEXER_SCAN_INTERVAL_MILLIS: ${LOCAL_RAG_SCAN_INTERVAL_MILLIS:-300000}
      RAG_OLLAMA_BASE_URL: ${LOCAL_RAG_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RAG_EMBEDDING_MODEL: ${LOCAL_RAG_EMBEDDING_MODEL:-qwen3-embedding:4b}
      RAG_WEAVIATE_URL: http://weaviate:8080
      LOCAL_RAG_SOURCE_REGISTRY: ${LOCAL_RAG_SOURCE_REGISTRY:-/config/source-registry.local.example.yaml}
      LOCAL_RAG_SOURCE_PERSONAL_NOTES: ${LOCAL_RAG_SOURCE_PERSONAL_NOTES:-/source/personal-notes}
      LOCAL_RAG_SOURCE_PROJECT_ALPHA_DOCS: ${LOCAL_RAG_SOURCE_PROJECT_ALPHA_DOCS:-/source/project-alpha-docs}
      LOCAL_RAG_SOURCE_PROJECT_BETA_DOCS: ${LOCAL_RAG_SOURCE_PROJECT_BETA_DOCS:-/source/project-beta-docs}
      LOCAL_RAG_INDEXER_REGISTRY_REQUIRE_PATHS: "true"
      LOCAL_RAG_INDEXER_EMBEDDING_FALLBACK_ENABLED: ${LOCAL_RAG_EMBEDDING_FALLBACK_ENABLED:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/local_rag
      SPRING_DATASOURCE_USERNAME: local_rag
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_RAG_POSTGRES_PASSWORD:-local-rag-dev}
    volumes:
      - "${LOCAL_RAG_CONFIG_DIR:-./config}:/config:ro"
      - "${LOCAL_RAG_SOURCE_ROOT:-./data/sample}:/source:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      source-registry-service:
        condition: service_started

  retrieval-service:
    build:
      context: .
      dockerfile: services/retrieval-service/Dockerfile
    container_name: local-rag-retrieval
    restart: unless-stopped
    environment:
      SERVER_PORT: 42143
      RAG_OLLAMA_BASE_URL: ${LOCAL_RAG_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RAG_EMBEDDING_MODEL: ${LOCAL_RAG_EMBEDDING_MODEL:-qwen3-embedding:4b}
      RAG_CHAT_MODEL: ${LOCAL_RAG_CHAT_MODEL:-}
      RAG_OMLX_BASE_URL: ${LOCAL_RAG_OMLX_BASE_URL:-}
      RAG_WEAVIATE_URL: http://weaviate:8080
      LOCAL_RAG_RETRIEVAL_EMBEDDING_FALLBACK_ENABLED: ${LOCAL_RAG_EMBEDDING_FALLBACK_ENABLED:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/local_rag
      SPRING_DATASOURCE_USERNAME: local_rag
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_RAG_POSTGRES_PASSWORD:-local-rag-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy

  mcp-bridge:
    build:
      context: .
      dockerfile: services/mcp-bridge/Dockerfile
    container_name: local-rag-mcp-bridge
    restart: unless-stopped
    environment:
      SERVER_PORT: 42144
      RAG_SOURCE_REGISTRY_URL: http://source-registry-service:42141
      RAG_RETRIEVAL_URL: http://retrieval-service:42143
      RAG_INDEXER_URL: http://indexer-service:42142
    depends_on:
      - retrieval-service
      - indexer-service

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: local-rag-api-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:42120:42120"
    environment:
      SERVER_PORT: 42120
      RAG_SOURCE_REGISTRY_URL: http://source-registry-service:42141
      RAG_INDEXER_URL: http://indexer-service:42142
      RAG_RETRIEVAL_URL: http://retrieval-service:42143
      RAG_MCP_BRIDGE_URL: http://mcp-bridge:42144
    depends_on:
      - source-registry-service
      - indexer-service
      - retrieval-service
      - mcp-bridge
