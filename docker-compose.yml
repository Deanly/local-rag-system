name: local-rag-system

services:
  postgres:
    image: postgres:16-alpine
    container_name: local-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: local_rag
      POSTGRES_USER: local_rag
      POSTGRES_PASSWORD: ${LOCAL_RAG_POSTGRES_PASSWORD:-local-rag-dev}
    ports:
      - "127.0.0.1:42130:5432"
    volumes:
      - "${LOCAL_RAG_DATA_DIR:-./.runtime}/postgres:/var/lib/postgresql/data"
      - "./database/postgres/ddl:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_rag -d local_rag"]
      interval: 10s
      timeout: 5s
      retries: 10

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.25.9
    container_name: local-rag-weaviate
    restart: unless-stopped
    ports:
      - "127.0.0.1:42131:8080"
      - "127.0.0.1:42132:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 20
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - "${LOCAL_RAG_DATA_DIR:-./.runtime}/weaviate:/var/lib/weaviate"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  source-registry-service:
    build:
      context: .
      dockerfile: services/source-registry-service/Dockerfile
    container_name: local-rag-source-registry
    restart: unless-stopped
    environment:
      SERVER_PORT: 42141
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/local_rag
      SPRING_DATASOURCE_USERNAME: local_rag
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_RAG_POSTGRES_PASSWORD:-local-rag-dev}
      LOCAL_RAG_REGISTRY_PATH: ${LOCAL_RAG_REGISTRY_PATH:-/config/source-registry.local.example.yaml}
      LOCAL_RAG_REGISTRY_REQUIRE_PATHS: ${LOCAL_RAG_REGISTRY_REQUIRE_PATHS:-true}
      LOCAL_RAG_SOURCE_PERSONAL_NOTES: ${LOCAL_RAG_SOURCE_PERSONAL_NOTES:-/source/personal-notes}
      LOCAL_RAG_SOURCE_PROJECT_ALPHA_DOCS: ${LOCAL_RAG_SOURCE_PROJECT_ALPHA_DOCS:-/source/project-alpha-docs}
      LOCAL_RAG_SOURCE_PROJECT_BETA_DOCS: ${LOCAL_RAG_SOURCE_PROJECT_BETA_DOCS:-/source/project-beta-docs}
      LOCAL_RAG_SOURCE_LOCAL_RAG_SYSTEM_DOCS: ${LOCAL_RAG_SOURCE_LOCAL_RAG_SYSTEM_DOCS:-/sources/source-04}
      LOCAL_RAG_SOURCE_EXTRA_06: ${LOCAL_RAG_SOURCE_EXTRA_06:-/sources/source-06}
      LOCAL_RAG_SOURCE_EXTRA_07: ${LOCAL_RAG_SOURCE_EXTRA_07:-/sources/source-07}
      LOCAL_RAG_SOURCE_EXTRA_08: ${LOCAL_RAG_SOURCE_EXTRA_08:-/sources/source-08}
    volumes:
      - "${LOCAL_RAG_CONFIG_DIR:-./config}:/config:ro"
      - "${LOCAL_RAG_SOURCE_ROOT:-./data/sample}:/source:ro"
      - "${LOCAL_RAG_HOST_SOURCE_01:-./data/sample/project-alpha-docs}:/sources/source-01:ro"
      - "${LOCAL_RAG_HOST_SOURCE_02:-./data/sample/project-beta-docs}:/sources/source-02:ro"
      - "${LOCAL_RAG_HOST_SOURCE_03:-./data/sample/personal-notes}:/sources/source-03:ro"
      - "${LOCAL_RAG_HOST_SOURCE_04:-./data/sample/project-alpha-docs}:/sources/source-04:ro"
      - "${LOCAL_RAG_HOST_SOURCE_05:-./data/sample/personal-notes}:/sources/source-05:ro"
      - "${LOCAL_RAG_HOST_SOURCE_06:-./data/sample/project-alpha-docs}:/sources/source-06:ro"
      - "${LOCAL_RAG_HOST_SOURCE_07:-./data/sample/project-beta-docs}:/sources/source-07:ro"
      - "${LOCAL_RAG_HOST_SOURCE_08:-./data/sample/personal-notes}:/sources/source-08:ro"
    depends_on:
      postgres:
        condition: service_healthy

  indexer-service:
    build:
      context: .
      dockerfile: services/indexer-service/Dockerfile
    container_name: local-rag-indexer
    restart: unless-stopped
    environment:
      SERVER_PORT: 42142
      LOCAL_RAG_INDEXER_SCAN_INTERVAL: ${LOCAL_RAG_INDEXER_SCAN_INTERVAL:-PT5M}
      LOCAL_RAG_INDEXER_WATCH_ENABLED: ${LOCAL_RAG_INDEXER_WATCH_ENABLED:-true}
      LOCAL_RAG_INDEXER_WATCH_DEBOUNCE: ${LOCAL_RAG_INDEXER_WATCH_DEBOUNCE:-PT10S}
      LOCAL_RAG_OLLAMA_BASE_URL: ${LOCAL_RAG_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_RAG_OLLAMA_BASE_URLS: ${LOCAL_RAG_OLLAMA_BASE_URLS:-}
      LOCAL_RAG_OLLAMA_CONNECT_TIMEOUT: ${LOCAL_RAG_OLLAMA_CONNECT_TIMEOUT:-PT1.5S}
      LOCAL_RAG_OLLAMA_READ_TIMEOUT: ${LOCAL_RAG_OLLAMA_READ_TIMEOUT:-PT2M}
      LOCAL_RAG_OLLAMA_HEALTH_TIMEOUT: ${LOCAL_RAG_OLLAMA_HEALTH_TIMEOUT:-PT1.5S}
      LOCAL_RAG_OLLAMA_EMBEDDING_MODEL: ${LOCAL_RAG_OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:4b}
      LOCAL_RAG_WEAVIATE_URL: ${LOCAL_RAG_WEAVIATE_URL:-http://weaviate:8080}
      LOCAL_RAG_REGISTRY_PATH: ${LOCAL_RAG_REGISTRY_PATH:-/config/source-registry.local.example.yaml}
      LOCAL_RAG_REGISTRY_REQUIRE_PATHS: ${LOCAL_RAG_REGISTRY_REQUIRE_PATHS:-true}
      LOCAL_RAG_SOURCE_PERSONAL_NOTES: ${LOCAL_RAG_SOURCE_PERSONAL_NOTES:-/source/personal-notes}
      LOCAL_RAG_SOURCE_PROJECT_ALPHA_DOCS: ${LOCAL_RAG_SOURCE_PROJECT_ALPHA_DOCS:-/source/project-alpha-docs}
      LOCAL_RAG_SOURCE_PROJECT_BETA_DOCS: ${LOCAL_RAG_SOURCE_PROJECT_BETA_DOCS:-/source/project-beta-docs}
      LOCAL_RAG_SOURCE_LOCAL_RAG_SYSTEM_DOCS: ${LOCAL_RAG_SOURCE_LOCAL_RAG_SYSTEM_DOCS:-/sources/source-04}
      LOCAL_RAG_SOURCE_EXTRA_06: ${LOCAL_RAG_SOURCE_EXTRA_06:-/sources/source-06}
      LOCAL_RAG_SOURCE_EXTRA_07: ${LOCAL_RAG_SOURCE_EXTRA_07:-/sources/source-07}
      LOCAL_RAG_SOURCE_EXTRA_08: ${LOCAL_RAG_SOURCE_EXTRA_08:-/sources/source-08}
      LOCAL_RAG_INDEXER_EMBEDDING_FALLBACK_ENABLED: ${LOCAL_RAG_INDEXER_EMBEDDING_FALLBACK_ENABLED:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/local_rag
      SPRING_DATASOURCE_USERNAME: local_rag
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_RAG_POSTGRES_PASSWORD:-local-rag-dev}
    volumes:
      - "${LOCAL_RAG_CONFIG_DIR:-./config}:/config:ro"
      - "${LOCAL_RAG_SOURCE_ROOT:-./data/sample}:/source:ro"
      - "${LOCAL_RAG_HOST_SOURCE_01:-./data/sample/project-alpha-docs}:/sources/source-01:ro"
      - "${LOCAL_RAG_HOST_SOURCE_02:-./data/sample/project-beta-docs}:/sources/source-02:ro"
      - "${LOCAL_RAG_HOST_SOURCE_03:-./data/sample/personal-notes}:/sources/source-03:ro"
      - "${LOCAL_RAG_HOST_SOURCE_04:-./data/sample/project-alpha-docs}:/sources/source-04:ro"
      - "${LOCAL_RAG_HOST_SOURCE_05:-./data/sample/personal-notes}:/sources/source-05:ro"
      - "${LOCAL_RAG_HOST_SOURCE_06:-./data/sample/project-alpha-docs}:/sources/source-06:ro"
      - "${LOCAL_RAG_HOST_SOURCE_07:-./data/sample/project-beta-docs}:/sources/source-07:ro"
      - "${LOCAL_RAG_HOST_SOURCE_08:-./data/sample/personal-notes}:/sources/source-08:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      source-registry-service:
        condition: service_started

  retrieval-service:
    build:
      context: .
      dockerfile: services/retrieval-service/Dockerfile
    container_name: local-rag-retrieval
    restart: unless-stopped
    environment:
      SERVER_PORT: 42143
      LOCAL_RAG_OLLAMA_BASE_URL: ${LOCAL_RAG_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_RAG_OLLAMA_BASE_URLS: ${LOCAL_RAG_OLLAMA_BASE_URLS:-}
      LOCAL_RAG_OLLAMA_CONNECT_TIMEOUT: ${LOCAL_RAG_OLLAMA_CONNECT_TIMEOUT:-PT1.5S}
      LOCAL_RAG_OLLAMA_READ_TIMEOUT: ${LOCAL_RAG_OLLAMA_READ_TIMEOUT:-PT2M}
      LOCAL_RAG_OLLAMA_HEALTH_TIMEOUT: ${LOCAL_RAG_OLLAMA_HEALTH_TIMEOUT:-PT1.5S}
      LOCAL_RAG_OLLAMA_EMBEDDING_MODEL: ${LOCAL_RAG_OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:4b}
      LOCAL_RAG_OLLAMA_CHAT_MODEL: ${LOCAL_RAG_OLLAMA_CHAT_MODEL:-}
      LOCAL_RAG_OLLAMA_CHAT_MAX_TOKENS: ${LOCAL_RAG_OLLAMA_CHAT_MAX_TOKENS:-512}
      LOCAL_RAG_OLLAMA_CHAT_TEMPERATURE: ${LOCAL_RAG_OLLAMA_CHAT_TEMPERATURE:-0.1}
      LOCAL_RAG_OLLAMA_CHAT_THINKING_ENABLED: ${LOCAL_RAG_OLLAMA_CHAT_THINKING_ENABLED:-false}
      LOCAL_RAG_WEAVIATE_URL: ${LOCAL_RAG_WEAVIATE_URL:-http://weaviate:8080}
      LOCAL_RAG_RETRIEVAL_RERANKER_ENABLED: ${LOCAL_RAG_RETRIEVAL_RERANKER_ENABLED:-false}
      LOCAL_RAG_RETRIEVAL_RERANKER_BASE_URL: ${LOCAL_RAG_RETRIEVAL_RERANKER_BASE_URL:-}
      LOCAL_RAG_RETRIEVAL_RERANKER_CONNECT_TIMEOUT: ${LOCAL_RAG_RETRIEVAL_RERANKER_CONNECT_TIMEOUT:-PT0.5S}
      LOCAL_RAG_RETRIEVAL_RERANKER_READ_TIMEOUT: ${LOCAL_RAG_RETRIEVAL_RERANKER_READ_TIMEOUT:-PT5S}
      LOCAL_RAG_RETRIEVAL_SCORE_GATE_ENABLED: ${LOCAL_RAG_RETRIEVAL_SCORE_GATE_ENABLED:-false}
      LOCAL_RAG_RETRIEVAL_SCORE_GATE_MAX_K: ${LOCAL_RAG_RETRIEVAL_SCORE_GATE_MAX_K:-10}
      LOCAL_RAG_RETRIEVAL_SCORE_GATE_SIMILARITY_THRESHOLD: ${LOCAL_RAG_RETRIEVAL_SCORE_GATE_SIMILARITY_THRESHOLD:-0.70}
      LOCAL_RAG_RETRIEVAL_SCORE_GATE_RERANKER_THRESHOLD: ${LOCAL_RAG_RETRIEVAL_SCORE_GATE_RERANKER_THRESHOLD:-0.08}
      LOCAL_RAG_RETRIEVAL_SCORE_GATE_SIMILARITY_WEIGHT: ${LOCAL_RAG_RETRIEVAL_SCORE_GATE_SIMILARITY_WEIGHT:-0.30}
      LOCAL_RAG_RETRIEVAL_SCORE_GATE_BUCKET2_THRESHOLD: ${LOCAL_RAG_RETRIEVAL_SCORE_GATE_BUCKET2_THRESHOLD:-0.255}
      LOCAL_RAG_RETRIEVAL_SCORE_GATE_BUCKET3_THRESHOLD: ${LOCAL_RAG_RETRIEVAL_SCORE_GATE_BUCKET3_THRESHOLD:-0.15}
      LOCAL_RAG_RETRIEVAL_EMBEDDING_FALLBACK_ENABLED: ${LOCAL_RAG_RETRIEVAL_EMBEDDING_FALLBACK_ENABLED:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/local_rag
      SPRING_DATASOURCE_USERNAME: local_rag
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_RAG_POSTGRES_PASSWORD:-local-rag-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy

  reranker-sidecar:
    profiles: ["scoregate"]
    build:
      context: .
      dockerfile: services/reranker-sidecar/Dockerfile
    container_name: local-rag-reranker
    restart: unless-stopped
    environment:
      LOCAL_RAG_RERANKER_MODEL: ${LOCAL_RAG_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      LOCAL_RAG_RERANKER_MAX_LENGTH: ${LOCAL_RAG_RERANKER_MAX_LENGTH:-1024}
      LOCAL_RAG_RERANKER_USE_FP16: ${LOCAL_RAG_RERANKER_USE_FP16:-false}
    ports:
      - "127.0.0.1:42145:42145"
    volumes:
      - "${LOCAL_RAG_DATA_DIR:-./.runtime}/huggingface:/root/.cache/huggingface"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:42145/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  mcp-bridge:
    build:
      context: .
      dockerfile: services/mcp-bridge/Dockerfile
    container_name: local-rag-mcp-bridge
    restart: unless-stopped
    environment:
      SERVER_PORT: 42144
      LOCAL_RAG_SERVICES_REGISTRY_URL: ${LOCAL_RAG_SERVICES_REGISTRY_URL:-http://source-registry-service:42141}
      LOCAL_RAG_SERVICES_RETRIEVAL_URL: ${LOCAL_RAG_SERVICES_RETRIEVAL_URL:-http://retrieval-service:42143}
      LOCAL_RAG_SERVICES_INDEXER_URL: ${LOCAL_RAG_SERVICES_INDEXER_URL:-http://indexer-service:42142}
      LOCAL_RAG_SERVICES_MCP_BRIDGE_URL: ${LOCAL_RAG_SERVICES_MCP_BRIDGE_URL:-http://mcp-bridge:42144}
    depends_on:
      - retrieval-service
      - indexer-service

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: local-rag-api-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:42120:42120"
    environment:
      SERVER_PORT: 42120
      LOCAL_RAG_SERVICES_REGISTRY_URL: ${LOCAL_RAG_SERVICES_REGISTRY_URL:-http://source-registry-service:42141}
      LOCAL_RAG_SERVICES_INDEXER_URL: ${LOCAL_RAG_SERVICES_INDEXER_URL:-http://indexer-service:42142}
      LOCAL_RAG_SERVICES_RETRIEVAL_URL: ${LOCAL_RAG_SERVICES_RETRIEVAL_URL:-http://retrieval-service:42143}
      LOCAL_RAG_SERVICES_MCP_BRIDGE_URL: ${LOCAL_RAG_SERVICES_MCP_BRIDGE_URL:-http://mcp-bridge:42144}
    depends_on:
      - source-registry-service
      - indexer-service
      - retrieval-service
      - mcp-bridge
